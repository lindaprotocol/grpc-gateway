// ==================== Original Scan Messages (Keep All Existing) ====================

// [Keep all your existing messages here - HomepageBundle, NodeMapResponse, 
//  Top10Request/Response, TopAccount, TopWitness, ProxyRequestMessage, 
//  ProxyResponse, TokenRequest, TokenListResponse, TokenInfo, LRC20TokenRequest,
//  LRC20TokenListResponse, LRC20TokenInfo, TokenHoldersRequest, TokenHoldersResponse,
//  TokenHolder, TokenTransfersRequest, TokenTransfersResponse, TokenTransfer,
//  AccountListRequest, AccountListResponse, AccountInfo, AccountResourceRequest,
//  AccountResourceResponse, StatsOverviewRequest, StatsOverviewResponse, ChartDataPoint,
//  TagRequest, TagInsertRequest, TagUpdateRequest, TagDeleteRequest, TagRecommendRequest,
//  TagResponse, TagListResponse, Tag, BlockRequest, BlockListResponse, TransactionRequest,
//  TransactionListResponse, TransactionInfo, SearchRequest, SearchResponse, SearchResult,
//  MarketPairRequest, MarketPairListResponse, MarketPair, ExchangeCalcRequest,
//  ExchangeCalcResponse, LedgerRequest, LedgerResponse, LedgerEntry]

syntax = "proto3";
package protocol;

import "core/Linda.proto";
import "core/Contract.proto";

option java_package = "org.linda.api.scan";
option java_outer_classname = "ScanMessages";

// ==================== Core System Messages ====================

message EmptyMessage {}

message NumberMessage {
  int64 num = 1;
}

message BytesMessage {
  bytes value = 1;
}

message AddressValidateResult {
  bool result = 1;
  string message = 2;
}

// ==================== Chain Parameters ====================

message ChainParameters {
  repeated ChainParameter chainParameter = 1;
}

message ChainParameter {
  string key = 1;
  int64 value = 2;
}

// ==================== Node Information ====================

message NodeInfo {
  int64 beginSyncNum = 1;
  string block = 2;
  string solidityBlock = 3;
  int64 currentConnectCount = 4;
  int64 activeConnectCount = 5;
  int64 passiveConnectCount = 6;
  int64 totalFlow = 7;
  repeated PeerInfo peerList = 8;
  NodeConfig configNodeInfo = 9;
  MachineInfo machineInfo = 10;
  map<string, string> cheatWitnessInfo = 11;
}

message PeerInfo {
  string host = 1;
  int32 port = 2;
  string headBlockId = 3;
  int64 headBlockNum = 4;
  int64 latency = 5;
  string solidifyBlockId = 6;
  int64 solidifyBlockNum = 7;
  string peerType = 8;
  string nodeId = 9;
  int64 connectTime = 10;
  double inTraffic = 11;
  double outTraffic = 12;
  string lastSyncBlock = 13;
  string lastSolidityBlock = 14;
}

message NodeConfig {
  string codeVersion = 1;
  string version = 2;
  int32 p2pVersion = 3;
  int32 listenPort = 4;
  bool discoverEnable = 5;
  int32 activeNodeSize = 6;
  int32 passiveNodeSize = 7;
  int32 sendNodeSize = 8;
  int32 maxConnectCount = 9;
  int32 sameIpMaxConnectCount = 10;
  int32 backupListenPort = 11;
  int32 backupMemberSize = 12;
  int32 backupPriority = 13;
  int32 dbVersion = 14;
  int32 minParticipationRate = 15;
  bool supportConstant = 16;
  double minTimeRatio = 17;
  double maxTimeRatio = 18;
  int64 allowCreationOfContracts = 19;
  int64 allowAdaptiveEnergy = 20;
}

message MachineInfo {
  int32 threadCount = 1;
  int64 deadLockedThreadCount = 2;
  int64 cpuCount = 3;
  int64 totalMemory = 4;
  int64 freeMemory = 5;
  double cpuRate = 6;
  string javaVersion = 7;
  string osName = 8;
  string osVersion = 9;
  string osArch = 10;
  int64 jvmTotalMemory = 11;
  int64 jvmFreeMemory = 12;
  double processCpuRate = 13;
  repeated MemoryDescInfo memoryDescInfoList = 14;
  repeated MemoryDescInfo memoryPoolDescInfoList = 15;
}

message MemoryDescInfo {
  string name = 1;
  int64 initSize = 2;
  int64 useSize = 3;
  int64 maxSize = 4;
  double useRate = 5;
}

// ==================== Burn & Metrics ====================

message BurnLindInfo {
  int64 burnLindAmount = 1;
  int64 lindSupply = 2;
}

message MetricsInfo {
  int64 interval = 1;
  map<string, double> counters = 2;
  map<string, MeterInfo> meters = 3;
  map<string, HistogramInfo> histograms = 4;
  map<string, TimerInfo> timers = 5;
}

message MeterInfo {
  int64 count = 1;
  double meanRate = 2;
  double m1Rate = 3;
  double m5Rate = 4;
  double m15Rate = 5;
  double rateUnit = 6;
}

message HistogramInfo {
  int64 count = 1;
  double max = 2;
  double mean = 3;
  double min = 4;
  double p50 = 5;
  double p75 = 6;
  double p95 = 7;
  double p98 = 8;
  double p99 = 9;
  double p999 = 10;
  double stddev = 11;
}

message TimerInfo {
  int64 count = 1;
  double meanRate = 2;
  double m1Rate = 3;
  double m5Rate = 4;
  double m15Rate = 5;
  double rateUnit = 6;
  double durationUnit = 7;
  HistogramInfo histogram = 8;
}

// ==================== Account & Resource Messages ====================

message AccountNetMessage {
  int64 freeNetUsed = 1;
  int64 freeNetLimit = 2;
  int64 netUsed = 3;
  int64 netLimit = 4;
  map<string, int64> assetNetUsed = 5;
  map<string, int64> assetNetLimit = 6;
  int64 totalNetLimit = 7;
  int64 totalNetWeight = 8;
}

message AccountResourceMessage {
  int64 freeNetUsed = 1;
  int64 freeNetLimit = 2;
  int64 netUsed = 3;
  int64 netLimit = 4;
  map<string, int64> assetNetUsed = 5;
  map<string, int64> assetNetLimit = 6;
  int64 totalNetLimit = 7;
  int64 totalNetWeight = 8;
  int64 energyUsed = 9;
  int64 energyLimit = 10;
  int64 totalEnergyLimit = 11;
  int64 totalEnergyWeight = 12;
  int64 storageUsed = 13;
  int64 storageLimit = 14;
}

message DelegatedResourceRequest {
  bytes fromAddress = 1;
  bytes toAddress = 2;
}

message DelegatedResourceList {
  repeated DelegatedResource delegatedResource = 1;
}

message DelegatedResourceAccountIndex {
  bytes account = 1;
  repeated bytes fromAccounts = 2;
  repeated bytes toAccounts = 3;
  repeated bytes fromAccountsV2 = 4;
  repeated bytes toAccountsV2 = 5;
}

message CanDelegatedMaxSizeRequest {
  bytes ownerAddress = 1;
  int64 type = 2;
}

message CanDelegatedMaxSizeResponse {
  int64 maxSize = 1;
}

message AvailableUnfreezeCountRequest {
  bytes ownerAddress = 1;
}

message AvailableUnfreezeCountResponse {
  int64 count = 1;
}

message CanWithdrawUnfreezeAmountRequest {
  bytes ownerAddress = 1;
  int64 timestamp = 2;
}

message CanWithdrawUnfreezeAmountResponse {
  int64 amount = 1;
}

// ==================== Block Messages ====================

message BlockLimit {
  int64 startNum = 1;
  int64 endNum = 2;
}

message BlockReq {
  int64 num = 1;
  bytes hash = 2;
  bool detail = 3;
}

message BlockExtention {
  repeated TransactionExtention transactions = 1;
  BlockHeader blockHeader = 2;
  bytes blockid = 3;
}

message TransactionExtention {
  Transaction transaction = 1;
  repeated bytes txid = 2;
  bytes constantResult = 3;
  Return result = 4;
  int64 energyUsed = 5;
  repeated TransactionInfo.Logs logs = 6;
  repeated InternalTransaction internalTransactions = 7;
}

message InternalTransaction {
  bytes hash = 1;
  bytes callerAddress = 2;
  bytes transferToAddress = 3;
  repeated TransferInfo callValueInfo = 4;
  bytes note = 5;
  bool rejected = 6;
  bytes extra = 7;
}

message TransferInfo {
  int64 amount = 1;
  bytes tokenId = 2;
}

message BlockBalanceRequest {
  int64 blockNum = 1;
  bytes address = 2;
}

message BlockBalanceResponse {
  int64 balance = 1;
  int64 blockNum = 2;
  repeated AssetBalance assetBalance = 3;
}

message AssetBalance {
  bytes assetName = 1;
  int64 balance = 2;
}

// ==================== Transaction Messages ====================

message TransactionReceipt {
  int64 energyFee = 1;
  int64 energyUsage = 2;
  int64 energyUsageTotal = 3;
  int64 netFee = 4;
  int64 netUsage = 5;
  Result result = 6;
}

message TransactionInfoList {
  repeated TransactionInfo transactionInfo = 1;
}

message TransactionSignWeight {
  Transaction transaction = 1;
  repeated Permission permissions = 2;
  bytes currentSignWeight = 3;
  repeated bytes approvedList = 4;
  int64 currentPermission = 5;
}

message TransactionApprovedList {
  Transaction transaction = 1;
  repeated Permission permissions = 2;
  repeated bytes approvedList = 3;
  int64 currentPermission = 4;
}

// ==================== Pagination ====================

message PaginatedMessage {
  int64 offset = 1;
  int64 limit = 2;
}

// ==================== Proposal & Exchange Lists ====================

message ProposalList {
  repeated Proposal proposals = 1;
}

message ExchangeList {
  repeated Exchange exchanges = 1;
}

// ==================== Market Messages ====================

message MarketPairList {
  repeated MarketPair marketPair = 1;
}

message MarketPair {
  string id = 1;
  string pairName = 2;
  bytes sellTokenId = 3;
  bytes buyTokenId = 4;
}

message MarketOrderList {
  repeated MarketOrder orders = 1;
}

message MarketOrder {
  bytes orderId = 1;
  bytes ownerAddress = 2;
  int64 createTime = 3;
  bytes sellTokenId = 4;
  bytes buyTokenId = 5;
  int64 sellTokenQuantity = 6;
  int64 buyTokenQuantity = 7;
  int64 sellTokenQuantityRemain = 8;
  int64 buyTokenQuantityRemain = 9;
  int64 sellTokenQuantityFrozen = 10;
  int64 buyTokenQuantityFrozen = 11;
  int64 price = 12;
  int64 sellTokenPrice = 13;
  int64 buyTokenPrice = 14;
  int64 orderStatus = 15;
}

message MarketPriceRequest {
  bytes sellTokenId = 1;
  bytes buyTokenId = 2;
}

message MarketPriceList {
  repeated MarketPrice prices = 1;
}

message MarketPrice {
  int64 sellTokenQuantity = 1;
  int64 buyTokenQuantity = 2;
}

message MarketOrderListRequest {
  bytes sellTokenId = 1;
  bytes buyTokenId = 2;
  int64 limit = 3;
}

// ==================== Smart Contract Messages ====================

message EstimateEnergyMessage {
  TransactionExtention result = 1;
  int64 energyRequired = 2;
}

message ClearABIContract {
  bytes ownerAddress = 1;
  bytes contractAddress = 2;
}

message UpdateSettingContract {
  bytes ownerAddress = 1;
  bytes contractAddress = 2;
  int64 consumeUserResourcePercent = 3;
}

message UpdateEnergyLimitContract {
  bytes ownerAddress = 1;
  bytes contractAddress = 2;
  int64 originEnergyLimit = 3;
}

// ==================== Shielded Transaction Messages ====================

message ExpandedSpendingKeyMessage {
  bytes ask = 1;
  bytes nsk = 2;
  bytes ovk = 3;
}

message DiversifierMessage {
  bytes d = 1;
}

message IncomingViewingKeyMessage {
  bytes ivk = 1;
}

message ZenPaymentAddressRequest {
  bytes ivk = 1;
  bytes d = 2;
}

message ZenPaymentAddressInfo {
  bytes paymentAddress = 1;
  bytes d = 2;
  bytes pkD = 3;
}

message ShieldedAddressInfo {
  bytes sk = 1;
  bytes ask = 2;
  bytes nsk = 3;
  bytes ovk = 4;
  bytes ak = 5;
  bytes nk = 6;
  bytes ivk = 7;
  bytes d = 8;
  bytes pkD = 9;
  bytes paymentAddress = 10;
}

message ShieldedTransactionRequest {
  repeated ShieldNote inNotes = 1;
  repeated ShieldReceive outReceives = 2;
}

message ShieldNote {
  bytes value = 1;
  bytes r = 2;
  bytes rcm = 3;
  bytes d = 4;
  bytes pkD = 5;
  bytes valueCommitment = 6;
  bytes noteCommitment = 7;
  bytes nf = 8;
  bytes nullifier = 9;
  bytes nfBound = 10;
}

message ShieldReceive {
  bytes d = 1;
  bytes pkD = 2;
  bytes value = 3;
  bytes rcm = 4;
  bytes noteCommitment = 5;
  bytes epk = 6;
  bytes cEnc = 7;
  bytes cOut = 8;
}

message IvkMessage {
  bytes ivk = 1;
  int64 start = 2;
  int64 end = 3;
}

message OvkMessage {
  bytes ovk = 1;
  int64 start = 2;
  int64 end = 3;
}

message ShieldedNoteList {
  repeated ShieldNote notes = 1;
}

message SpendAuthSigRequest {
  bytes ask = 1;
  bytes ar = 2;
  bytes sighash = 3;
}

message ShieldNullifierRequest {
  bytes v = 1;
  bytes rho = 2;
  bytes ak = 3;
  bytes nk = 4;
}

message MerkleTreeVoucherRequest {
  repeated bytes noteCommitments = 1;
  int64 blockNum = 2;
}

message MerkleTreeVoucherInfo {
  repeated MerkleTreeVoucher vouchers = 1;
}

message MerkleTreeVoucher {
  bytes tree = 1;
  bytes value = 2;
  int64 position = 3;
  bytes path = 4;
}

message SpendRequest {
  bytes nf = 1;
  bytes noteCommitment = 2;
}

message SpendResult {
  bool result = 1;
  string message = 2;
}

// ==================== Shielded LRC20 Messages ====================

message ShieldedLRC20NoteRequest {
  bytes noteHash = 1;
  bytes txid = 2;
  int64 index = 3;
}

message ShieldedContractParametersRequest {
  repeated ShieldNote shieldNotes = 1;
  repeated ShieldReceive shieldReceives = 2;
  repeated ShieldNote contractNotes = 3;
  bytes contractAddress = 4;
  bytes shieldedTRC20ContractAddress = 5;
}

message ShieldedContractParameters {
  repeated bytes triggerInputs = 1;
  repeated ShieldNote notes = 2;
}

message ScanShieldedLRC20Request {
  bytes ak = 1;
  bytes nk = 2;
  bytes ivk = 3;
  bytes ovk = 4;
  int64 start = 5;
  int64 end = 6;
  bytes contractAddress = 7;
}

message ShieldedLRC20NoteList {
  repeated ShieldedLRC20Note notes = 1;
}

message ShieldedLRC20Note {
  bytes noteHash = 1;
  bytes transactionId = 2;
  int64 blockNum = 3;
  int64 index = 4;
  bytes value = 5;
  bytes rcm = 6;
  bytes d = 7;
  bytes pkD = 8;
  bytes epk = 9;
  bytes cEnc = 10;
  bytes cOut = 11;
  bool spent = 12;
}

message TriggerInputRequest {
  bytes shieldedTRC20ContractAddress = 1;
  bytes value = 2;
  bytes depositId = 3;
}

message TriggerInputResponse {
  bytes triggerInput = 1;
}

// ==================== V2 Freezing Messages ====================

message FreezeBalanceV2Contract {
  bytes ownerAddress = 1;
  bytes receiverAddress = 2;
  int64 frozenBalance = 3;
  int64 resource = 4;
}

message UnfreezeBalanceV2Contract {
  bytes ownerAddress = 1;
  bytes receiverAddress = 2;
  int64 unfreezeBalance = 3;
  int64 resource = 4;
}

message WithdrawExpireUnfreezeContract {
  bytes ownerAddress = 1;
}

message DelegateResourceContract {
  bytes ownerAddress = 1;
  bytes receiverAddress = 2;
  int64 balance = 3;
  int64 resource = 4;
  int64 lockPeriod = 5;
}

message UnDelegateResourceContract {
  bytes ownerAddress = 1;
  bytes receiverAddress = 2;
  int64 balance = 3;
  int64 resource = 4;
}

message CancelAllUnfreezeV2Contract {
  bytes ownerAddress = 1;
}

// ==================== Price Messages ====================

message PriceList {
  repeated Price prices = 1;
}

message Price {
  int64 price = 1;
  int64 blockNum = 2;
  int64 timestamp = 3;
}

// ==================== Account Balance Messages ====================

message AccountBalanceRequest {
  bytes address = 1;
  int64 blockNum = 2;
  repeated bytes assetIds = 3;
}

message AccountBalanceResponse {
  int64 balance = 1;
  int64 blockNum = 2;
  repeated AssetBalance assetBalance = 3;
}

// ==================== Event Query Messages ====================

message EventQueryRequest {
  int32 limit = 1;
  string sort = 2;
  int32 start = 3;
  int64 block = 4;
  int64 since = 5;
}

message TransferQueryRequest {
  int32 limit = 1;
  string sort = 2;
  int32 start = 3;
  int64 block = 4;
  string from = 5;
  string to = 6;
  string token = 7;
}

message TransferList {
  repeated Transfer transfers = 1;
  int64 total = 2;
}

message Transfer {
  string transactionId = 1;
  int64 blockNum = 2;
  int64 timestamp = 3;
  string from = 4;
  string to = 5;
  string value = 6;
  string token = 7;
}

message EventList {
  repeated Event events = 1;
  int64 total = 2;
}

message Event {
  string eventName = 1;
  string contractAddress = 2;
  string transactionId = 3;
  int64 blockNum = 4;
  int64 timestamp = 5;
  repeated string topics = 6;
  string data = 7;
}

message EventContractRequest {
  string contractAddress = 1;
  int32 limit = 2;
  string sort = 3;
  int32 start = 4;
  int64 since = 5;
  int64 block = 6;
}

message EventNameRequest {
  string contractAddress = 1;
  string eventName = 2;
  int32 limit = 3;
  string sort = 4;
  int32 start = 5;
  int64 since = 6;
}

message EventBlockRequest {
  string contractAddress = 1;
  string eventName = 2;
  int64 blockNumber = 3;
}

message EventTimeRequest {
  int64 since = 1;
  int32 limit = 2;
  string sort = 3;
  int32 start = 4;
  string contract = 5;
}

message BlockQueryRequest {
  int32 limit = 1;
  string sort = 2;
  int32 start = 3;
  int64 block = 4;
}

message ContractLogRequest {
  int32 limit = 1;
  string sort = 2;
  int32 start = 3;
  int64 block = 4;
}

message ContractLogList {
  repeated ContractLog logs = 1;
  int64 total = 2;
}

message ContractLog {
  string address = 1;
  string blockHash = 2;
  int64 blockNumber = 3;
  string data = 4;
  int64 logIndex = 5;
  bool removed = 6;
  repeated string topics = 7;
  string transactionHash = 8;
  int64 transactionIndex = 9;
}

message ContractABIRequest {
  string transactionId = 1;
  string contractAddress = 2;
  string uniqueId = 3;
  string abi = 4;
}

message ParsedContractLogList {
  repeated ParsedContractLog logs = 1;
}

message ParsedContractLog {
  string name = 1;
  map<string, string> parameters = 2;
  string contractAddress = 3;
  string transactionId = 4;
  int64 blockNumber = 5;
  int64 timestamp = 6;
}